<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!--
      CSP de défense en profondeur. Le bundle JS est servi depuis /assets (même
      origine) et les polices sont auto-hébergées : aucun domaine tiers n'est
      nécessaire. Le CSP borne surtout les dégâts d'une dépendance compromise
      (script-src, connect-src, object-src 'none').
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.onrender.com http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'"
    />
    <title>Classora — Gestion scolaire pour les écoles privées au Sénégal</title>
    <meta
      name="description"
      content="Classora : la plateforme de gestion des écoles privées au Sénégal. Inscriptions, bulletins automatiques, suivi des paiements et messagerie parents-enseignants, du CI à la Terminale."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://classora-gsay.onrender.com/" />

    <!-- Open Graph / Twitter : aperçu de partage du site (la SPA affine
         og:url/og:title par page via usePageMeta). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Classora" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://classora-gsay.onrender.com/" />
    <meta property="og:title" content="Classora — Gestion scolaire pour les écoles privées au Sénégal" />
    <meta
      property="og:description"
      content="Inscriptions, bulletins automatiques, suivi des paiements et messagerie parents-enseignants : un seul outil pour diriger votre école privée, du CI à la Terminale."
    />
    <meta property="og:image" content="https://classora-gsay.onrender.com/images/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Classora — Gestion scolaire pour les écoles privées au Sénégal" />
    <meta
      name="twitter:description"
      content="Inscriptions, bulletins automatiques, suivi des paiements et messagerie parents-enseignants : un seul outil pour diriger votre école privée."
    />
    <meta name="twitter:image" content="https://classora-gsay.onrender.com/images/hero.jpg" />

    <!-- Données structurées : informations factuelles uniquement (nom, URL,
         logo, contact déjà publiés sur le site). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://classora-gsay.onrender.com/#organization",
            "name": "Classora",
            "url": "https://classora-gsay.onrender.com/",
            "logo": "https://classora-gsay.onrender.com/images/logo-lime.png",
            "email": "contact@classora.sn",
            "areaServed": "SN"
          },
          {
            "@type": "WebSite",
            "@id": "https://classora-gsay.onrender.com/#website",
            "url": "https://classora-gsay.onrender.com/",
            "name": "Classora",
            "inLanguage": "fr-FR",
            "publisher": { "@id": "https://classora-gsay.onrender.com/#organization" }
          }
        ]
      }
    </script>

    <!-- Icônes de l'onglet et des raccourcis (toutes les pages de la SPA).
         Le SVG est prioritaire sur les navigateurs récents ; l'ICO et les PNG
         couvrent les navigateurs plus anciens, iOS et Android/PWA. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />
    <!-- Polices auto-hébergées : plus aucune requête vers un domaine tiers
         ne bloque le premier rendu. Cabinet Grotesk (variable 100–900) et les
         icônes Material Symbols, limitées aux icônes réellement utilisées.
         Préchargées : le texte et les icônes s'affichent sans attente. -->
    <link rel="preload" href="/fonts/cabinet-grotesk.woff2?v=1" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/material-symbols-rounded.woff2?v=1" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
